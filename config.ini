# Side-Channel Attack Configuration File
# Edit these values to match your setup

[Hardware]
# Serial port for Arduino connection
serial_port = COM8

# Baud rate for serial communication
baud_rate = 115200

# Oscilloscope VISA address
visa_address = TCPIP::169.254.116.192::INSTR

# Maximum password length to test
max_password_length = 16

[Attack Parameters]
# Minimum timing jump (in microseconds) to consider a "hit"
# Typical values: 30-50µs depending on your setup
jump_threshold_us = 35.0

# Number of verification measurements for suspected hits
verification_count = 2

# Maximum variance allowed during verification (µs)
max_variance_us = 15.0

# Delay between character tests (seconds)
# Increase if you're getting noisy measurements
inter_char_delay = 0.05

# Smart Phantom Hit Rescanning
# Enable focused rescanning around phantom hits (recommended!)
phantom_rescan_enabled = true

# Number of characters to scan on each side of phantom hit
# E.g., window=7 means scan 7 chars before and 7 chars after (15 total)
phantom_rescan_window = 7

# How many times to rescan the window
# Multiple attempts help overcome transient noise
phantom_rescan_attempts = 3

# Robust Measurement Parameters
# Number of times to retry a failed measurement
measurement_retries = 2

# Delay before each measurement (seconds) for scope stability
pre_measurement_delay = 0.05

# Reset oscilloscope every N measurements to prevent drift
scope_reset_interval = 20

# Use median of multiple samples instead of single measurement
use_median_filter = true

# Number of samples to take per measurement (median will be used)
samples_per_measurement = 1

[Charset]
# Character set to test (in order of priority)
# Default: letters first, then digits, then symbols
charset = 0123456789

[Display]
# Verbosity level:
# 0 = Minimal (only major events)
# 1 = Normal (progress bars and important events)
# 2 = Verbose (measurement details)
# 3 = Ultra-verbose (everything including scope status)
verbosity = 3

# Show progress bars during character testing
show_progress_bars = true

# Enable colorized output (disable for log file redirection)
use_colors = true

[Warmup]
# Number of warmup measurements before attack
warmup_count = 3

# Delay between warmup measurements (seconds)
warmup_delay = 0.1

[Scope]
# Oscilloscope timeout (milliseconds)
scope_timeout = 10000

# Number of retries for scope arming
scope_arm_retries = 30

# Number of retries for trigger status polling
trigger_poll_retries = 100